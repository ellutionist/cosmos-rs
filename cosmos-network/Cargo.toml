[package]
name = "cosmos-network"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1"
base64 = "0.22"
percent-encoding = "2.3"
httparse = "1"
url = "2.5"
cosmos = { path = "../cosmos" }
fastwebsockets = { version = "0.8", default-features = false, features = ["upgrade", "unstable-split"] }
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "server-auto", "http1", "http2", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tower-service = "0.3"
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.49", features = ["rt-multi-thread"] }
