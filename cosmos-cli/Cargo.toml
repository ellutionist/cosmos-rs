[package]
name = "cosmos-cli"
version = "0.1.0"
edition = "2021"
description = "Lua command-line runner powered by cosmos Machine"

[features]
default = ["network"]
full = ["network", "encoding", "encryption", "database", "image", "text"]
network = ["dep:cosmos-network"]
encoding = ["dep:cosmos-encoding"]
image = ["dep:cosmos-image"]
text = ["dep:cosmos-text"]
encryption = ["dep:cosmos-encryption"]
database = ["mysql", "redis"]
mysql = ["dep:cosmos-database", "cosmos-database/mysql", "network", "encoding", "encryption"]
redis = ["dep:cosmos-database", "cosmos-database/redis", "network"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
cosmos = { path = "../cosmos" }
cosmos-network = { path = "../cosmos-network", optional = true }
cosmos-encoding = { path = "../cosmos-encoding", optional = true }
cosmos-image = { path = "../cosmos-image", optional = true }
cosmos-text = { path = "../cosmos-text", optional = true }
cosmos-encryption = { path = "../cosmos-encryption", optional = true }
cosmos-database = { path = "../cosmos-database", default-features = false, optional = true }
tokio = { version = "1.49", features = ["rt"] }
