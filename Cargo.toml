[package]
name = "cosmos-rs"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["cosmos", "cosmos-macros", "cosmos-network"]

[dependencies]
cosmos = { path = "cosmos" }
tokio = { version = "1", features = ["rt", "time", "net", "io-util"] }
cosmos-ext-demo = { path = "../cosmos-ext-demo" }
cosmos-network = { path = "cosmos-network" }
