[package]
name = "cosmos-database"
version = "0.1.0"
edition = "2021"
description = "cosmos 的异步数据库插件"

[features]
default = ["mysql", "redis"]
mysql = ["dep:cosmos-network", "dep:cosmos-encoding", "dep:cosmos-encryption", "dep:url", "dep:percent-encoding"]
redis = ["dep:cosmos-network", "dep:url", "dep:percent-encoding"]

[dependencies]
cosmos = { path = "../cosmos" }
cosmos-network = { path = "../cosmos-network", optional = true }
cosmos-encoding = { path = "../cosmos-encoding", optional = true }
cosmos-encryption = { path = "../cosmos-encryption", optional = true }
url = { version = "2.5", optional = true }
percent-encoding = { version = "2.3", optional = true }

[dev-dependencies]
tokio = { version = "1.49", features = ["rt", "net", "io-util", "time", "macros"] }
rsa = "0.9"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
