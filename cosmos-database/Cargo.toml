[package]
name = "cosmos-database"
version = "0.1.0"
edition = "2021"
description = "cosmos 的异步数据库插件"

[dependencies]
cosmos = { path = "../cosmos" }
cosmos-network = { path = "../cosmos-network" }
cosmos-encoding = { path = "../cosmos-encoding" }
cosmos-encryption = { path = "../cosmos-encryption" }
url = "2.5"
percent-encoding = "2.3"

[dev-dependencies]
tokio = { version = "1.49", features = ["rt", "net", "io-util", "time", "macros"] }
rsa = "0.9"
rand = "0.8"
sha1 = "0.10"
sha2 = "0.10"
