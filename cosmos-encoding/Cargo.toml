[package]
name = "cosmos-encoding"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "cosmos 的 Rust 原生编解码模块"

[dependencies]
cosmos = { path = "../cosmos" }
base64 = "0.22"
hex = "0.4"
percent-encoding = "2.3"
sonic-rs = { version = "0.5", features = ["arbitrary_precision"] }
serde = "1"
serde-saphyr = "1.3"
toml = "1.2"

[dev-dependencies]
tokio = { version = "1.49", features = ["rt", "time"] }
